name: Publish EyeSync site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - downloads/**
      - ai/**
      - fonts/**
      - vendor/mediapipe/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public website files
        run: |
          mkdir public
          cp index.html LICENSE public/
          cp -r downloads ai fonts vendor public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
